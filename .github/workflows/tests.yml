name: Financial Market Data Platform CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run linting syntax check
        run: |
          python -m compileall src tests

      - name: Execute Automated Unit & Regression Tests
        run: |
          python -m pytest tests/ -v --durations=10

      - name: Verify dbt SQL Models and Schema Integrity
        run: |
          python src/transformations/dbt_runner.py

      - name: Verify ML Zero-Leakage & Inference Engine
        run: |
          python src/ml/predict.py
