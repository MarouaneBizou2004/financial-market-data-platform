[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-market-data-platform"
version = "1.0.0"
description = "Institutional-grade financial market data platform featuring Medallion architecture, PySpark, PostgreSQL, dbt, risk analytics, and ML market regimes."
authors = [{ name = "Senior Data Engineer & Analytics Engineer" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "yfinance>=0.2.35",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.4.0",
    "pyarrow>=14.0.0",
    "duckdb>=0.10.0",
    "streamlit>=1.30.0",
    "plotly>=5.18.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "joblib>=1.3.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "pytest>=8.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
